# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "RMS Size Helper"
client_id = "154f1d77bd75ca9d8a0c638bcc64059c"
application_url = "https://size-helper.reedmace.net"
embedded = true

[access_scopes]
scopes = "read_products,read_inventory,write_customers,read_orders"

[auth]
redirect_urls = [
  "https://size-helper.reedmace.net/api/auth/callback"
]

[webhooks]
api_version = "2024-01"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/api/webhooks/app/uninstalled"

[app_proxy]
url = "/api/public"
subpath = "size-helper"
prefix = "apps"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
dev_store_url = "reedmace.myshopify.com"
